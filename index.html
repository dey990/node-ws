<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常用工具导航</title>
<style>
* {margin: 0;padding: 0;box-sizing: border-box;}
body {
  background: #f5f7fa;
  font-family: "Microsoft Yahei",sans-serif;
  padding: 40px 20px;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
}
h1 {
  text-align: center;
  color: #222;
  margin-bottom: 40px;
  font-size: 28px;
}
.nav-box {
  background: #fff;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px #00000010;
}
.nav-title {
  font-size: 18px;
  color: #333;
  margin-bottom: 15px;
  border-left: 4px solid #2563eb;
  padding-left: 10px;
}
.link-list {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.link-list a {
  text-decoration: none;
  color: #555;
  background: #f0f4ff;
  padding: 8px 16px;
  border-radius: 6px;
  transition: 0.3s;
}
.link-list a:hover {
  background: #2563eb;
  color: #fff;
}
</style>
</head>
<body>
<div class="container">
  <h1>常用工具导航</h1>

  <!-- AI工具 -->
  <div class="nav-box">
    <div class="nav-title">AI 工具</div>
    <div class="link-list">
      <a href="https://huggingface.co" target="_blank">HuggingFace</a>
      <a href="https://chat.openai.com" target="_blank">ChatGPT</a>
      <a href="https://www.doubao.com" target="_blank">豆包</a>
      <a href="https://tongyi.aliyun.com" target="_blank">通义千问</a>
      <a href="https://kimi.moonshot.cn" target="_blank">Kimi</a>
    </div>
  </div>

  <!-- 开发编程 -->
  <div class="nav-box">
    <div class="nav-title">开发编程</div>
    <div class="link-list">
      <a href="https://github.com" target="_blank">GitHub</a>
      <a href="https://gitee.com" target="_blank">Gitee</a>
      <a href="https://www.runoob.com" target="_blank">菜鸟教程</a>
      <a href="https://tool.oschina.net" target="_blank">开源工具</a>
      <a href="https://c.runoob.com" target="_blank">在线运行</a>
    </div>
  </div>

  <!-- 办公学习 -->
  <div class="nav-box">
    <div class="link-list">
      <a href="https://www.baidu.com" target="_blank">百度</a>
      <a href="https://www.zhihu.com" target="_blank">知乎</a>
      <a href="https://www.wps.cn" target="_blank">WPS</a>
      <a href="https://note.youdao.com" target="_blank">有道云笔记</a>
    </div>
  </div>

  <!-- 网盘/资源 -->
  <div class="nav-box">
    <div class="nav-title">网盘 & 资源</div>
    <div class="link-list">
      <a href="https://pan.baidu.com" target="_blank">百度网盘</a>
      <a href="https://pan.xunlei.com" target="_blank">迅雷网盘</a>
      <a href="https://alist.nn.ci" target="_blank">Alist</a>
    </div>
  </div>

  <!-- 实用工具 -->
  <div class="nav-box">
    <div class="nav-title">实用工具</div>
    <div class="link-list">
      <a href="https://www.tiantongtools.com" target="_blank">全能工具箱</a>
      <a href="https://svgomg.com" target="_blank">图片压缩</a>
      <a href="https://convertio.co" target="_blank">格式转换</a>
      <a href="https://www.ip138.com" target="_blank">IP查询</a>
    </div>
  </div>

</div>
</body>
</html>
